<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Download App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    overflow:hidden;
}

.bg{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    filter:blur(10px);
}

.bg1{
    top:-80px;
    left:-80px;
}

.bg2{
    bottom:-100px;
    right:-80px;
}

.card{
    position:relative;
    width:90%;
    max-width:380px;
    padding:35px 28px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.1);
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    animation:fade 1s ease;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:24px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    color:white;
    font-weight:700;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(59,130,246,0.4);
}

h1{
    color:white;
    font-size:28px;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    font-size:14px;
    line-height:1.6;
    margin-bottom:28px;
}

.download-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px;
    border-radius:16px;
    text-decoration:none;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    font-size:17px;
    font-weight:600;
    transition:0.3s;
    box-shadow:0 10px 25px rgba(37,99,235,0.35);
}

.download-btn:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 15px 35px rgba(37,99,235,0.5);
}

.download-btn:active{
    transform:scale(0.98);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.footer{
    margin-top:18px;
    color:#94a3b8;
    font-size:12px;
}
</style>
</head>
<body>

<div class="bg bg1"></div>
<div class="bg bg2"></div>

<div class="card">

    <div class="logo">⬇</div>

    <h1>Download Now</h1>

    <p>
        Download and signup if you want to grow.
        Download kro yahan sa aur grow kro.
    </p>

    <!-- CHANGE LINK HERE -->
    <a href="https://jeetogame.com/?code=18703151" class="download-btn">
        Download
    </a>

    <div class="footer">
        © 2026 Your Brand
    </div>

</div>

</body>
</html>
